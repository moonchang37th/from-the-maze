<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>from the maze</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="game">
        <svg
            xmlns="http://www.w3.org/2000/svg"
            style="position: absolute; width: 0; height: 0;"
            aria-hidden="true">
        <filter id="wave-filter">
        <feTurbulence
            id="wave-turbulence"
            type="fractalNoise"
            baseFrequency="0.015 0.08"
            numOctaves="2"
            seed="2"
            result="noise">

            <animate
                attributeName="baseFrequency"
                dur="0.5s"
                values="0.015 0.08; 0.025 0.15; 0.015 0.08"
                repeatCount="indefinite"/>
        </feTurbulence>

        <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="0">

            <animate
                attributeName="scale"
                dur="0.3s"
                values="0; 1; 3; 8; 15"
                fill="freeze"/>
        </feDisplacementMap>
        </filter>
        </svg>
        <div id="background"></div>
        <div id="next-background"></div>
        <div id="start-screen">
            <p id="start-text">[게임을 시작하려면 클릭해 주세요]</p>
        </div>

        <div id="branch-screen" class="hidden">
            <div id="branch-choices">
                <p class="branch-choice">열린 길</p>
                <p class="branch-choice">쥐 죽은 듯 조용하고 어두운 길</p>
                <p class="branch-choice">큐브 같은 공간이 끝없이</p>
                <p class="branch-choice">지나온 흔적을 돌아보는 숲</p>
                <p class="branch-choice">머리카락이 뜯긴 자리에 누워보기</p>
            </div>

            <div id="story-container" class="hidden">
                <div id="story-text"></div>
                <button id="continue-button" class="hidden">계속하기</button>
            </div>
        </div> 
    </main>

    <script src="stories.js"></script>
    <script src="script.js"></script>

</body>
</html>
